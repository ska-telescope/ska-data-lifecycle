apiVersion: v1
kind: Service
metadata:
  name: {{ include "ska-dlm.fullname" . }}-migration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ska-dlm.migration.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  selector:
    component: {{ .Values.migration.component }}
    subsystem: {{ .Values.migration.subsystem }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ska-dlm.fullname" . }}-migration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ska-dlm.migration.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.migration.replicas }}
  selector:
    matchLabels:
      component: {{ .Values.migration.component }}
      subsystem: {{ .Values.migration.subsystem }}
  template:
    metadata:
      labels:
        {{- include "ska-dlm.migration.labels" . | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-rclone
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              MAX_RETRIES=40
              DELAY=3
              RETRY_COUNT=0

              until wget -qO- --timeout=5 --tries=1 http://{{ include "ska-dlm.fullname" . }}-rclone/ >/dev/null 2>&1; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                echo "Waiting for rclone service '{{ include "ska-dlm.fullname" . }}-rclone'... attempt $RETRY_COUNT/$MAX_RETRIES"
                if [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; then
                  echo "Rclone service did not become ready after $MAX_RETRIES attempts"
                  exit 1
                fi
                sleep $DELAY
              done
              echo "rclone is ready"
        - name: wait-for-postgrest
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              MAX_RETRIES=40
              DELAY=3
              RETRY_COUNT=0

              until wget -qO- --timeout=5 --tries=1 http://{{ include "ska-dlm.fullname" . }}-postgrest/data_item >/dev/null 2>&1; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                echo "Waiting for PostgREST /data_item... attempt $RETRY_COUNT/$MAX_RETRIES"
                if [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; then
                  echo "PostgREST endpoint did not become ready after $MAX_RETRIES attempts"
                  exit 1
                fi
                sleep $DELAY
              done
              echo "postgrest is ready"
      containers:
      - name: migration
        image: {{ .Values.migration.image}}:{{ .Values.migration.version }}
        imagePullPolicy: {{ .Values.migration.imagePullPolicy }}
        command:
        - uvicorn
        - ska_dlm.dlm_migration.dlm_migration_requests:rest
        - --host
        - "0.0.0.0"
        - --port
        - "80"
        ports:
        - name: http-port
          containerPort: 80
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: http-port
          periodSeconds: 5
          initialDelaySeconds: 5
        livenessProbe:
          tcpSocket:
            port: http-port
          periodSeconds: 5
          initialDelaySeconds: 5
        volumeMounts:
        - name: dlm-configmap
          mountPath: "/home/ska-dlm/.dlm"
          readOnly: true
      volumes:
      - name: dlm-configmap
        configMap:
          name: {{ include "ska-dlm.fullname" . }}-configmap
