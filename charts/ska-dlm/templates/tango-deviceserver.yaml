# This template runs the DLMMetrics device
# source: https://gitlab.com/ska-telescope/sdp/ska-sdp-integration/-/blob/master/charts/ska-sdp/templates/lmc-operator.yaml
{{- if .Values.tango.enabled }}
{{- $clusterdomain := coalesce .Values.global.cluster_domain "cluster.local" }}
{{- $tangohost := coalesce .Values.global.tango_host "tango-databaseds:10000" }}
{{- $databaseds := (split ":" $tangohost)._0 }}
{{- $tangoname := .Values.tango.prefix }}
apiVersion: tango.tango-controls.org/v1
kind: DeviceServer
metadata:
  name: dlm-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ska-dlm.labels" . | nindent 4 }}
    component: {{ .Values.tango.component }}
    subsystem: {{ .Values.tango.subsystem }}
    domain: {{ .Values.tango.metrics.domain }}
    function: {{ .Values.tango.metrics.function }}
    intent: production
spec:
  legacycompatibility: true
  clusterDomain: {{ $clusterdomain }}
  enableLoadBalancer: {{ or (.Values.global.exposeAllDS | default false) .Values.tango.loadBalancer }}
  databaseds: {{ $databaseds }}
  image: "{{ .Values.tango.image }}:{{ .Values.tango.version }}"
  imagePullPolicy: {{ .Values.tango.imagePullPolicy }}
  command: "DLMMetrics"
  args: "0"
  dsname: "DLMMetrics"
  config: |
    {
      "servers": {
        "DLMMetrics": {
          "0": {
            "DLMMetrics": {
              {{ $tangoname | quote }}: {}
            }
          }
        }
      }
    }

  env:
    # Skip loading the legacy src/ska_dlm/config.yaml file, which is being phased out.
    - name: DLM_SKIP_CONFIG
      value: "true"
    - name: DLM_IMAGE
      value: "{{ .Values.tango.image }}:{{ .Values.tango.version }}"

    # PostgreSQL connection credentials.
    {{- range $envvar_name := tuple "PGUSER" "PGPASSWORD" "PGHOST" "PGDATABASE" }}
    - name: {{ $envvar_name }}
      valueFrom:
        secretKeyRef:
          name: {{ include "ska-dlm.postgrest.db-auth-secret-name" $ }}
          key: {{ $envvar_name }}
    {{- end }}
    - name: PGPORT
      valueFrom:
        secretKeyRef:
          name: {{ include "ska-dlm.postgrest.db-auth-secret-name" $ }}
          key: PGPORT
          optional: true

    {{- with .Values.tango.env }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if .Values.tango.tolerations }}
  tolerations: {{ toYaml .Values.tango.tolerations | nindent 4 }}
  {{- end }}
  {{- if .Values.tango.affinity }}
  affinity: {{ toYaml .Values.tango.affinity | nindent 4 }}
  {{- end }}

{{- end }}
