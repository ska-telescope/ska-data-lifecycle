apiVersion: v1
kind: Service
metadata:
  name: {{ include "ska-dlm.fullname" . }}-archive
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ska-dlm.archive.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: ssh
      port: 22
      targetPort: 2222
      protocol: TCP
  selector:
    component: {{ .Values.archive.component }}
    subsystem: {{ .Values.archive.subsystem }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ska-dlm.fullname" . }}-archive
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ska-dlm.archive.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.archive.replicas }}
  selector:
    matchLabels:
      component: {{ .Values.archive.component }}
      subsystem: {{ .Values.archive.subsystem }}
  template:
    metadata:
      labels:
        {{- include "ska-dlm.archive.labels" . | nindent 8 }}
    spec:
      {{- include "ska-dlm.nodeSelector" . | nindent 6 }}
      {{- with .Values.archive.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: archive
        image: {{ .Values.archive.image }}:{{ .Values.archive.version }}
        imagePullPolicy: {{ .Values.archive.imagePullPolicy }}
        env:
        - name: PUID
          value: "0"
        - name: PGID
          value: "0"
        - name: TZ
          value: "Etc/UTC"
        - name: SUDO_ACCESS
          value: "true"
        - name: PASSWORD_ACCESS
          value: "false"
        - name: PUBLIC_KEY_ACCESS
          value: "true"
        - name: PUBLIC_KEY_FILE
          value: {{ printf "%s/id_rsa.pub" .Values.sshKey.mountPath | quote }}
        volumeMounts:
          - name: shared-storage
            mountPath: {{ .Values.archive.mountPath | quote }}
          - name: rclone-ssh-key
            mountPath: {{ .Values.sshKey.mountPath | quote }}
            readOnly: true
        lifecycle:
            postStart:
              exec:
                command:
                  - "/bin/bash"
                  - "-c"
                  - |
                    mkdir -p /root/.ssh
                    cat {{ .Values.sshKey.mountPath }}/id_rsa.pub >> /root/.ssh/authorized_keys
                    chmod 700 /root/.ssh
                    chmod 600 /root/.ssh/authorized_keys
                    echo "PermitRootLogin yes" >> /etc/ssh/sshd_config
                    echo "PasswordAuthentication yes" >> /etc/ssh/sshd_config
                    echo "UsePAM yes" >> /etc/ssh/sshd_config
      volumes:
      - name: shared-storage
        persistentVolumeClaim:
          claimName: {{ .Values.archive.pvcName }}
      - name: rclone-ssh-key
        secret:
          secretName: {{ include "ska-dlm.ssh-key-secret.name" . }}
          defaultMode: 0440