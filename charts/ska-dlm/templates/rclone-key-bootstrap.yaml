apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ska-dlm.ssh-key-bootstrap.name" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ska-dlm.ssh-key-bootstrap.name" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ include "ska-dlm.ssh-key-secret.name" . | quote }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ska-dlm.ssh-key-bootstrap.name" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ include "ska-dlm.ssh-key-bootstrap.name" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ska-dlm.ssh-key-bootstrap.name" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ska-dlm.ssh-key-bootstrap.name" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: rclone-key-bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "ska-dlm.ssh-key-bootstrap.name" . }}
      containers:
        - name: create-key-secret
          image: "{{ .Values.sshKey.bootstrap.image }}:{{ .Values.sshKey.bootstrap.version }}"
          imagePullPolicy: {{ .Values.sshKey.bootstrap.imagePullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              existing_secret="$(kubectl get secret "$SSH_KEY_SECRET_NAME" \
                --namespace "$POD_NAMESPACE" --ignore-not-found --output=name)"
              if [ -n "$existing_secret" ]; then
                if ! kubectl get secret "$SSH_KEY_SECRET_NAME" --namespace "$POD_NAMESPACE" \
                  --output=jsonpath='{.data.id_rsa}' | grep -q . ||
                  ! kubectl get secret "$SSH_KEY_SECRET_NAME" --namespace "$POD_NAMESPACE" \
                    --output=jsonpath='{.data.id_rsa\.pub}' | grep -q .; then
                  echo "Existing SSH key Secret is missing a key-pair file" >&2
                  exit 1
                fi
                echo "SSH key Secret already exists; leaving it unchanged"
                exit 0
              fi

              umask 077
              key_dir="$(mktemp -d)"
              trap 'rm -rf "$key_dir"' EXIT
              ensure-rclone-ssh-key "$key_dir"
              kubectl create secret generic "$SSH_KEY_SECRET_NAME" \
                --namespace "$POD_NAMESPACE" \
                --from-file=id_rsa="$key_dir/id_rsa" \
                --from-file=id_rsa.pub="$key_dir/id_rsa.pub"
          env:
            - name: SSH_KEY_SECRET_NAME
              value: {{ include "ska-dlm.ssh-key-secret.name" . | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
