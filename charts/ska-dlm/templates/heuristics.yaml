apiVersion: v1
kind: Service
metadata:
  name: {{ include "ska-dlm.fullname" . }}-heuristics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ska-dlm.heuristics.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  selector:
    component: {{ .Values.heuristics.component }}
    subsystem: {{ .Values.heuristics.subsystem }}
{{- $workers := .Values.heuristics.workers | default (list (dict "name" "all" "replicas" .Values.heuristics.replicas)) }}
{{- $names := list }}
{{- range $worker := $workers }}
{{- if not (has $worker.name (list "all" "expiry" "storage")) }}
{{- fail (printf "invalid heuristic worker: %s" $worker.name) }}
{{- end }}
{{- if has $worker.name $names }}
{{- fail (printf "duplicate heuristic worker: %s" $worker.name) }}
{{- end }}
{{- $names = append $names $worker.name }}
{{- end }}
{{- if and (has "all" $names) (gt (len $names) 1) }}
{{- fail "heuristic worker 'all' cannot be combined with other workers" }}
{{- end }}
{{- range $worker := $workers }}
{{- with $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ska-dlm.fullname" . }}-heuristics{{ if ne $worker.name "all" }}-{{ $worker.name }}{{ end }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ska-dlm.heuristics.labels" . | nindent 4 }}
spec:
  replicas: {{ if hasKey $worker "replicas" }}{{ $worker.replicas }}{{ else }}1{{ end }}
  selector:
    matchLabels:
      component: {{ .Values.heuristics.component }}
      subsystem: {{ .Values.heuristics.subsystem }}
      {{- if ne $worker.name "all" }}
      heuristic-worker: {{ $worker.name }}
      {{- end }}
  template:
    metadata:
      labels:
        {{- include "ska-dlm.heuristics.labels" . | nindent 8 }}
        {{- if ne $worker.name "all" }}
        heuristic-worker: {{ $worker.name }}
        {{- end }}
    spec:
      serviceAccountName: {{ printf "%s-postgrest" .Release.Name }}
      initContainers:
      # Have to use index as ska-db-migrations has a "-" which throws an error when using the dot notation
      {{- if index .Values "ska-db-migrations" "job" "enabled" }}
        - name: wait-for-migrations
          image: "rancher/kubectl:v1.35.5"
          imagePullPolicy: IfNotPresent
          command:
            - kubectl
          args:
            - wait
            - --namespace={{ .Release.Namespace }}
            - --for=condition=complete
            - --timeout=3000s
            - job/db-migrations-{{ .Release.Name }}
      {{- end }}
        - name: wait-for-postgres
          image: postgres:17.4
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$PGHOST" -p "${PGPORT:-5432}" -U "$PGUSER" -d "$PGDATABASE"; do
                echo "waiting for database"
                sleep 2
              done

              echo "Database is reachable."

          env:
            {{- range $envvar_name := tuple "PGUSER" "PGPASSWORD" "PGHOST" "PGDATABASE" }}
            - name: {{ $envvar_name }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "ska-dlm.postgrest.db-auth-secret-name" $ }}
                  key: {{ $envvar_name }}
            {{- end }}
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "ska-dlm.postgrest.db-auth-secret-name" $ }}
                  key: PGPORT
                  optional: true
        - name: wait-for-dlm-schema
          image: postgres:17.4
          command:
            - sh
            - -c
            - |
              echo "Waiting for dlm tables to exist..."
              until PGPASSWORD="$PGPASSWORD" psql \
                -h "$PGHOST" \
                -p "${PGPORT:-5432}" \
                -U "$PGUSER" \
                -d "$PGDATABASE" \
                -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema='dlm' AND table_name='data_item'" | grep -q 1; do
                sleep 2
              done

              echo "Database schema looks ready."
          env:
            {{- range $envvar_name := tuple "PGUSER" "PGPASSWORD" "PGHOST" "PGDATABASE" }}
            - name: {{ $envvar_name }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "ska-dlm.postgrest.db-auth-secret-name" $ }}
                  key: {{ $envvar_name }}
            {{- end }}
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "ska-dlm.postgrest.db-auth-secret-name" $ }}
                  key: PGPORT
                  optional: true

      containers:
        - name: heuristics
          image: "{{ .Values.heuristics.image }}:{{ .Values.heuristics.version }}"
          imagePullPolicy: {{ .Values.heuristics.imagePullPolicy }}
          command:
            - ska-dlm-heuristics
          env:
            {{- range $envvar_name := tuple "PGUSER" "PGPASSWORD" "PGHOST" "PGDATABASE" }}
            - name: {{ $envvar_name }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "ska-dlm.postgrest.db-auth-secret-name" $ }}
                  key: {{ $envvar_name }}
            {{- end }}
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "ska-dlm.postgrest.db-auth-secret-name" $ }}
                  key: PGPORT
                  optional: true
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(PGUSER):$(PGPASSWORD)@$(PGHOST)/$(PGDATABASE)"
            - name: DLM_HEURISTIC_POLL_INTERVAL
              value: {{ .Values.heuristics.pollInterval | default 10 | quote }}
            - name: DLM_HEURISTIC_WORKER
              value: {{ $worker.name | quote }}
          volumeMounts:
            - name: dlm-configmap
              mountPath: "/home/ska-dlm/.dlm"
              readOnly: true
      volumes:
        - name: dlm-configmap
          configMap:
            name: {{ include "ska-dlm.fullname" . }}-configmap
{{- end }}
{{- end }}