apiVersion: v1
kind: Service
metadata:
  name: {{ include "ska-dlm.fullname" . }}-rclone-worker-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ska-dlm.rclone-worker.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    component: {{ .Values.rcloneWorker.component }}
    subsystem: {{ .Values.rcloneWorker.subsystem }}
