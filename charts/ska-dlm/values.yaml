# ------------------------------------------------
# Default Helm configuration for ska-dlm server
# ------------------------------------------------

# ------ Global configuration (shared across components / subcharts) ------
global:
  ingress:
    enabled: false
    domainName: "sdhp.stfc.skao.int"  # external ingress domain; required for whitelisting redirects
  development: true  # true for local deployment (to trigger gateway & keycloak)
  storageClass: "localdisk"  # existing storage class
  cluster_domain: cluster.local # the internal Kubernetes DNS domain, used for communication between services inside the cluster
  operator: false # The SKA Tango operator
  tango_host: databaseds-tango-base.dp-shared:10000 # Tango database to connect to. <service_name>.<namespace>:port

  sharedpvc:
    # Shared PVC that can be mounted by multiple pods.
    # Default behaviour assumes the shared PVC is pre-provisioned (e.g. by CI/cluster tooling),
    # to avoid Helm upgrade failures due to immutable PVC fields.
    pv:
      create: false  # PV is cluster-scoped; do not create via Helm by default
      name: shared
      storageSize: 2Gi
      storageClassName: ""  # empty string => no StorageClass (static PV)

    pvc:
      name: shared
      # Default false – assume the shared PVC is pre-created (e.g. by CI/cluster tooling).
      # Set true only for first-time installs into a fresh namespace.
      create: false
      storageSize: 2Gi
      storageClassName: ""  # empty string => no StorageClass (static PVC)

# ------ Chart metadata / naming ------
system: dlm
nameOverride: ""
fullnameOverride: ""


# ------ Core DLM services and API ------

ingest:
  component: ingest
  subsystem: data-lifecycle-management
  image: registry.gitlab.com/ska-telescope/ska-data-lifecycle/ska-data-lifecycle
  version: "07256191"
  imagePullPolicy: Always
  replicas: 1

storage:
  component: storage
  subsystem: data-lifecycle-management
  image: registry.gitlab.com/ska-telescope/ska-data-lifecycle/ska-data-lifecycle
  version: "07256191"
  imagePullPolicy: Always
  replicas: 1
  securityContext: {}
  mountPath: "/dlm"

  locations: # Location endpoints (can list multiple)
    - name: SKA-DEV
      type: local-dev
      country: AU
      city: Perth
      facility: local
  endpointSecretName: ""
  endpoints: # Storage endpoints (can list multiple)
    - name: dlm-archive
      location: SKA-DEV
      storage_type: filesystem
      interface: posix
      storage_phase: SOLID
      root_directory: /
      config:
        name: dlm-archive
        type: sftp
        parameters:
          host: ska-dlm-archive
          port: 22
          user: root
          key_file: "/root/.ssh/id_rsa"

    - name: local
      location: SKA-DEV
      storage_type: filesystem
      interface: posix
      root_directory: /
      storage_phase: SOLID
      config:
        name: local
        type: alias
        parameters:
          remote: "/data"

migration:
  component: migration
  subsystem: data-lifecycle-management
  image: registry.gitlab.com/ska-telescope/ska-data-lifecycle/ska-data-lifecycle
  version: "07256191"
  imagePullPolicy: Always
  replicas: 1

request:
  component: request
  subsystem: data-lifecycle-management
  image: registry.gitlab.com/ska-telescope/ska-data-lifecycle/ska-data-lifecycle
  version: "07256191"
  imagePullPolicy: Always
  replicas: 1

postgrest:
  component: postgrest
  subsystem: data-lifecycle-management
  image: postgrest/postgrest
  version: "v13.0.7"
  imagePullPolicy: Always
  replicas: 1
  db_schema: dlm
  db_anon_role: ska_dlm_admin
  db_pool: 10
  server_host: '*4'
  secret_is_base64: false
  max_rows: ""
  pre_request: ""
  role_claim_key: '.role'
  log_level: info

  # PostgREST's auth details against PostgreSQL come from a Secret, which can be:
  # * Given to us by name (via ska-db-migrations.dbCredentialsSecretName), or
  # * Created via:
  #   * VSO, or
  #   * Automatically from the postgresql.auth section
  db_auth_secret:
    create: true  # true for local DB (postgresql.enabled=true)
    vault:
      enabled: false
      path: ""
      mount: ""
      type: "kv-v2"


heuristics:
  component: heuristics
  subsystem: data-lifecycle-management
  image: registry.gitlab.com/ska-telescope/ska-data-lifecycle/ska-data-lifecycle
  version: "07256191"
  imagePullPolicy: Always
  replicas: 1

ska-db-migrations:
  engine: liquibase
  dbCredentialsSecretName: "{{ .Release.Name }}-ska-dlm-postgrest-secret" # the single source of truth for the PostgreSQL Secret name.
  configMapName: "db-migrations-{{ .Release.Name }}"
  liquibase:
    # The ODA schema execution.execution_blocks must exist before enabling create-external-triggers.
    contextFilter: "create-schema"
    changelogFile: changelog.yaml
  job:
    enabled: true
    # ttl must be set to null as there are pods waiting for liquibase to finish. If dependant pod are restarted, they will start.
    ttl: null

# ------ Database options ------

postgresql:
  enabled: true  # whether to deploy a local 'test' DB instead of connecting to an existing DB
  image: postgres
  version: "17-bookworm"

  auth:
  # Used for local PostgreSQL bootstrap when postgresql.enabled=true
    username: ska_dlm_admin
    password: password
    database: ska_dlm_testing

  primary:
    containerSecurityContext:
      readOnlyRootFilesystem: false
    persistence:
      enabled: false
    podLabels:
      component: postgresql
      subsystem: data-lifecycle-management
    networkPolicy:
      enabled: false


# ------ Supporting infrastructure ------

rclone:
  component: rclone
  subsystem: data-lifecycle-management
  image: registry.gitlab.com/ska-telescope/ska-data-lifecycle/ska-data-lifecycle-rclone
  version: "608e5ef5"
  imagePullPolicy: Always
  replicas: 1
  securityContext: {}
  keyPath: "/dlm/users/dlm/.ssh/"
  mountPath: "/dlm"

  secret:
    enabled: false
    name: ""
    mountPoint: "/secrets/"
    ssl_key_name: ""
    ssl_cert_name: ""
    vault:
      enabled: false
      mount: ""
      type: kv-v2
      path: ""

rabbitmq: # internal message queue between DLM server and client
  enabled: true
  component: rabbitmq
  subsystem: data-lifecycle-management
  image: rabbitmq
  version: "4-management"
  imagePullPolicy: Always
  replicas: 1
  serviceType: ClusterIP
  securityContext: {}
  mountPath: "/dlm/"
  mnesiaBasePath: "/dlm/users/dlm/rabbitmq-data/"

  auth:
    username: guest
    password: guest
  management:
    enabled: true
    port: 15672
  port: 5672

outbox:
  enabled: true # true if rabbitmq enabled
  component: outbox
  subsystem: data-lifecycle-management
  image: registry.gitlab.com/ska-telescope/ska-data-lifecycle/ska-data-lifecycle
  version: "07256191"
  imagePullPolicy: Always
  replicas: 1
  rabbitmq:
    url: ""
    exchange: dlm.outbox
    pollInterval: 10
    batchSize: 50

gateway:
  enabled: false  # true if you need AAA for DLM
  component: gateway
  subsystem: data-lifecycle-management
  image: registry.gitlab.com/ska-telescope/ska-data-lifecycle/ska-data-lifecycle-test-gateway
  version: "608e5ef5"
  imagePullPolicy: Always
  replicas: 1
  secret:
    name: ""  # supply if gateway.enabled=true

keycloak:
  enabled: true  # false for production
  component: keycloak
  subsystem: data-lifecycle-management
  image: registry.gitlab.com/ska-telescope/ska-data-lifecycle/ska-data-lifecycle-test-keycloak
  version: "608e5ef5"
  imagePullPolicy: Always
  replicas: 1
  use_https: true

tango:
  enabled: true # Deploy the DLMMetrics Tango device.
  database:
    enabled: false # Whether DLM creates its own Tango database. If false, must reference an existing Tango database at global.tango_host.

ska-tango-devices:
  subsystem: ska-dlm
  domain: dlm
  devices:
    DLMMetrics:
      dlm/metrics/0: # match pattern '^[a-z0-9-]+/[a-z0-9-]+/[a-z0-9-.]+$'
        LoggingLevelDefault: 4 # 4=INFO, 5=DEBUG
  deviceServerTypes:
    DLMMetrics:
      metadata:
        component: tango
      image:
        registry: registry.gitlab.com/ska-telescope/ska-data-lifecycle
        name: ska-data-lifecycle
        tag: 2.4.0-dev.c07256191
        imagePullPolicy: IfNotPresent
      device_classes:
        - 'ska_dlm.dlm_tango.dlm_metrics_device.DLMMetrics'
      env:
        DLM_IMAGE: registry.gitlab.com/ska-telescope/ska-data-lifecycle/ska-data-lifecycle:07256191
        DLM_SKIP_CONFIG: "true" # Temporary workaround while src/ska_dlm/config.yaml is being phased out
      secrets:
        ska-dlm-ska-dlm-postgrest-secret: # TODO (DMAN-324): figure out how to pass the PostgreSQL connection details without hard-coding
          PGHOST:
            key: PGHOST
          PGPORT:
            key: PGPORT
          PGUSER:
            key: PGUSER
          PGPASSWORD:
            key: PGPASSWORD
          PGDATABASE:
            key: PGDATABASE
      resources:
        requests:
          memory: 100Mi
          cpu: 300m
        limits:
          cpu: 500m
          memory: 256Mi
      livenessProbe:
        initialDelaySeconds: 30
        periodSeconds: 30
        maxAgeSeconds: 30
      readinessProbe:
        initialDelaySeconds: 2
        periodSeconds: 10
  deviceServers: # if global.operator=true, ska-tango-devices will generate a DeviceServer custom resource.
    DLMMetrics:
      metrics-device:
        expose: true
        devices:
          DLMMetrics:
            - dlm/metrics/0 # match pattern '^[a-z0-9-]+/[a-z0-9-]+/[a-z0-9-.]+$'

# ------ Optional utilities ------

pgweb:  # see https://github.com/ectobit/charts/tree/main/pgweb
  enabled: true  # enable web IDE access to Postgres
  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /$2
    hosts:
    - paths:
      - path: /pgweb(/|$)(.*)
        pathType: ImplementationSpecific

benchmark:
  enabled: false  # Set to true to run the benchmarking pod (see scripts/README.md)
  component: benchmark
  subsystem: data-lifecycle-management
  image: registry.gitlab.com/ska-telescope/ska-data-lifecycle/ska-data-lifecycle-benchmark
  version: "608e5ef5"
  imagePullPolicy: Always
  name: register  # register or migrate
  config:
    host:
    token:
    sourceFile:
    mountPath:

# ------ Auxiliary utility images ------
kubectl:
  image: rancher/kubectl
  version: "v1.28.15-amd64"
  imagePullPolicy: Always

# ------ dlm-archive configuration (openssh-server) ------
archive:
  component: archive
  subsystem: data-lifecycle-management
  image: linuxserver/openssh-server
  version: "latest"
  imagePullPolicy: Always
  replicas: 1
  securityContext: {}
  pvcName: "shared"
  mountPath: "/dlm"
