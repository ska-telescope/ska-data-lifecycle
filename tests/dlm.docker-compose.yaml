include:
  - path: services.docker-compose.yaml

services:
  dlm_migration:
    platform: linux/amd64
    image: dlm_migration
    container_name: dlm_migration
    build:
      context: ..
      dockerfile: tests/Dockerfile-dlm-compose
    entrypoint: uvicorn ska_dlm.dlm_migration.dlm_migration_requests:rest --host 0.0.0.0 --port 80
    environment:
      - VIRTUAL_HOST=dlm_migration.localhost
      - DLM_MIGRATION_DATABASE_URL=postgresql+asyncpg://ska_dlm_admin:password@dlm_db:5432/ska_dlm_testing
    ports:
      - 8004:80
    depends_on:
      dlm_db:
        condition: service_healthy
      dlm_migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/openapi.json')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dlm_network

  dlm_rclone_worker:
    platform: linux/amd64
    image: dlm_rclone_worker
    restart: unless-stopped
    build:
      context: ..
      dockerfile: tests/Dockerfile-dlm-compose
    entrypoint: ["python", "-m", "ska_dlm.dlm_migration.rclone_worker"]
    environment:
      DLM_RCLONE_WORKER_DATABASE_URL: "postgresql+asyncpg://ska_dlm_admin:password@dlm_db:5432/ska_dlm_testing"
      DLM_RCLONE_WORKER_POLL_INTERVAL: "10"
      DLM_RCLONE_SSH_KEY_PATH: "/run/dlm-rclone-ssh/id_rsa"
    volumes:
      - data:/dlm
      - rclone-ssh-keys:/run/dlm-rclone-ssh:ro
    depends_on:
      dlm_db:
        condition: service_healthy
      dlm_migrations:
        condition: service_completed_successfully
      rclone-key-init:
        condition: service_completed_successfully
    networks:
      - dlm_network

  dlm_storage:
    platform: linux/amd64
    image: dlm_storage
    container_name: dlm_storage
    build:
      context: ..
      dockerfile: tests/Dockerfile-dlm-compose
    environment:
      VIRTUAL_HOST: "dlm_storage.localhost"
      DLM_RCLONE_SSH_KEY_PATH: "/run/dlm-rclone-ssh/id_rsa"
      SSH_PUBLIC_KEY_PATH: "/run/dlm-rclone-ssh/id_rsa.pub"
      LOCATION_CONFIG: "/home/ska-dlm/.dlm/location-config.json"
      STORAGE_CONFIG: "/home/ska-dlm/.dlm/storage-config.json"
    entrypoint: uvicorn ska_dlm.dlm_storage.dlm_storage_requests:rest --host 0.0.0.0 --port 80
    ports:
      - 8003:80
    volumes:
      - data:/dlm
      - rclone-ssh-keys:/run/dlm-rclone-ssh:ro
    depends_on:
      nginx-proxy:
        condition: service_started
      dlm_gateway:
        condition: service_started
      dlm_postgrest:
        condition: service_started
      dlm_archive:
        condition: service_started
      rclone-key-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/openapi.json')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dlm_network

  dlm_request:
    image: dlm_request
    container_name: dlm_request
    platform: linux/amd64
    build:
      context: ..
      dockerfile: tests/Dockerfile-dlm-compose
    entrypoint: uvicorn ska_dlm.dlm_request.dlm_request_requests:rest --host 0.0.0.0 --port 80
    environment:
      VIRTUAL_HOST: "dlm_request.localhost"
      PGHOST: "dlm_db"
      PGPORT: "5432"
      PGUSER: "ska_dlm_admin"
      PGPASSWORD: "password"
      PGDATABASE: "ska_dlm_testing"
    ports:
      - 8002:80
    depends_on:
      - nginx-proxy
      - dlm_gateway
      - dlm_postgrest
    healthcheck:
      test: ["CMD-SHELL", "ska-dlm --help || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dlm_network

  dlm_ingest:
    platform: linux/amd64
    image: dlm_ingest
    container_name: dlm_ingest
    build:
      context: ..
      dockerfile: tests/Dockerfile-dlm-compose
    entrypoint: uvicorn ska_dlm.dlm_ingest.dlm_ingest_requests:rest --host 0.0.0.0 --port 80
    environment:
      VIRTUAL_HOST: "dlm_ingest.localhost"
      PGHOST: "dlm_db"
      PGPORT: "5432"
      PGUSER: "ska_dlm_admin"
      PGPASSWORD: "password"
      PGDATABASE: "ska_dlm_testing"
      DLM_RCLONE_SSH_KEY_PATH: "/run/dlm-rclone-ssh/id_rsa"
    ports:
      - 8001:80
    volumes:
      - data:/data
      - data:/dlm
      - rclone-ssh-keys:/run/dlm-rclone-ssh:ro
    depends_on:
      nginx-proxy:
        condition: service_started
      dlm_postgrest:
        condition: service_started
      rclone-key-init:
        condition: service_completed_successfully
      dlm_gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "ska-dlm --help || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dlm_network

  dlm_heuristics:
    platform: linux/amd64
    image: dlm_heuristics
    container_name: dlm_heuristics
    build:
      context: ..
      dockerfile: tests/Dockerfile-heuristics
    environment:
      DLM_HEURISTIC_DATABASE_URL: "postgresql+asyncpg://ska_dlm_admin:password@dlm_db:5432/ska_dlm_testing"
      DLM_HEURISTIC_POLL_INTERVAL: "10"
      DLM_RCLONE_SSH_KEY_PATH: "/run/dlm-rclone-ssh/id_rsa"
      VIRTUAL_HOST: "dlm_heuristics.localhost"
    volumes:
      - data:/dlm
      - rclone-ssh-keys:/run/dlm-rclone-ssh:ro
    depends_on:
      nginx-proxy:
        condition: service_healthy
      dlm_db:
        condition: service_healthy
      rclone-key-init:
        condition: service_completed_successfully
      dlm_migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "ska-dlm --help || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dlm_network
