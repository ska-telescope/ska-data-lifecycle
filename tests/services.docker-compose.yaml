services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.11.6
    container_name: nginx-proxy
    attach: false
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - dlm_network
  dlm_gateway:
    platform: linux/amd64
    image: dlm_gateway
    container_name: dlm_gateway
    build:
       context: ..
       dockerfile: tests/Dockerfile-gateway
       args:
         - PORT=8000
    ports:
      - 8000:8000
    environment:
        KEYCLOAK_URL: "https://keycloak:8443/"
        REDIRECT_URL: "http://dlm_gateway:8000/auth_callback"
        REALM: "test"
        CLIENT_ID: "dlm"
        CLIENT_SECRET: "xU2a9SOTLJZSwvAzAlfoucqg4sCMgY6O"
        STATE: "magic_string"
        AUTH: "1"
        INGEST_CLIENT: "http://dlm_ingest"
        REQUESTS_CLIENT: "http://dlm_request"
        STORAGE_CLIENT: "http://dlm_storage"
        MIGRATION_CLIENT: "http://dlm_migration"
    healthcheck:
        test: curl --fail http://localhost:8000/heartbeat || exit 1
        interval: 5s
        timeout: 5s
        retries: 5
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - dlm_network

  dlm_outbox:
    platform: linux/amd64
    image: dlm_outbox
    container_name: dlm_outbox
    build:
      context: ..
      dockerfile: tests/Dockerfile-dlm-compose
    environment:
      DLM_OUTBOX_DATABASE_URL: "postgresql+asyncpg://ska_dlm_admin:password@dlm_db:5432/ska_dlm_testing"
      DLM_OUTBOX_RABBITMQ_URL: "amqp://guest:guest@rabbitmq/"
      DLM_OUTBOX_POLL_INTERVAL: "10"
      DLM_OUTBOX_BATCH_SIZE: "50"
      DLM_OUTBOX_EXCHANGE: "dlm.outbox"
    entrypoint: ["python", "-m", "ska_dlm.dlm_outbox.relay"]
    depends_on:
      dlm_db:
        condition: service_healthy
      dlm_migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ska-dlm --help || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dlm_network

  rclone-key-init:
    image: dlm_rclone_key_bootstrap
    build:
      context: ..
      dockerfile: tests/Dockerfile-rclone-key-bootstrap
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /keys
        if [ -s /keys/id_rsa ] && [ -s /keys/id_rsa.pub ]; then
          echo "SSH key pair already exists; leaving it unchanged"
        elif [ -e /keys/id_rsa ] || [ -e /keys/id_rsa.pub ]; then
          echo "Incomplete SSH key pair in rclone-ssh-keys volume" >&2
          exit 1
        else
          ensure-rclone-ssh-key /keys
        fi
        chown 0:1000 /keys/id_rsa
        chmod 640 /keys/id_rsa
        chmod 644 /keys/id_rsa.pub
    volumes:
      - rclone-ssh-keys:/keys
    networks:
      - dlm_network

  dlm_archive:
    platform: linux/amd64
    image: linuxserver/openssh-server
    container_name: dlm_archive
    ports:
      - 2222:2222
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - USER_NAME=dlm
      - PASSWORD_ACCESS=false
      - PUBLIC_KEY_ACCESS=true
      - PUBLIC_KEY_FILE=/run/dlm-rclone-ssh/id_rsa.pub
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/2222'"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      rclone-key-init:
        condition: service_completed_successfully
    volumes:
      - shared-tmpfs:/dlm
      - rclone-ssh-keys:/run/dlm-rclone-ssh:ro
    networks:
      - dlm_network

  dlm_postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: dlm_postgrest
    ports:
      - 3000:3000
    environment:
      PGRST_DB_URI: postgres://ska_dlm_admin:password@dlm_db:5432/ska_dlm_testing
      PGRST_OPENAPI_SERVER_PROXY_URI: http://dlm_postgrest:3000
      PGRST_DB_ANON_ROLE: ska_dlm_admin
      PGRST_DB_SCHEMAS: dlm
    depends_on:
      dlm_db:
        condition: service_healthy
      dlm_migrations:
        condition: service_completed_successfully
    networks:
      - dlm_network

  dlm_migrations:
    build:
      context: ..
      dockerfile: tests/Dockerfile-migrations
    image: dlm_migrations
    container_name: dlm_migrations
    command:
      - --url=jdbc:postgresql://dlm_db:5432/ska_dlm_testing
      - --username=ska_dlm_admin
      - --password=password
      - --driver=org.postgresql.Driver
      - --search-path=/changelog
      - --changelog-file=changelog.yaml
      - update
      - --context-filter=!create-db,!create-roles,create-schema,!create-external-triggers
    depends_on:
      dlm_db:
        condition: service_healthy
    networks:
      - dlm_network

  dlm_db:
    shm_size: '32gb'
    build:
       context: ..
       dockerfile: tests/Dockerfile-db
       shm_size: '32gb'
    image: dlm_db
    container_name: dlm_db
    hostname: dlm_db
    ports:
      - 5432:5432
    environment:
      - LC_ALL=C.UTF-8  # That's the only one installed in the image
      - POSTGRES_DB=ska_dlm_testing
      - POSTGRES_USER=ska_dlm_admin
      - POSTGRES_PASSWORD=password
    networks:
      - dlm_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ska_dlm_admin", "-d", "ska_dlm_testing"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dlm_network

  keycloak:
    build:
        context: ..
        dockerfile: tests/Dockerfile-keycloak
    image: keycloak
    command: start-dev --import-realm
    container_name: keycloak
    ports:
      - 8443:8443
    environment:
        KC_DB: "postgres"
        KC_DB_URL: "jdbc:postgresql://keycloak_db:5432/keycloak"
        KC_DB_USERNAME: "admin"
        KC_DB_PASSWORD: "maximum-finishing-punk"
        KC_HOSTNAME: "localhost"
        KEYCLOAK_ADMIN: "admin"
        KEYCLOAK_ADMIN_PASSWORD: "affirm-monoxide-earthling"
    healthcheck:
        # The management port uses TLS; probe the test realm on the internal HTTP listener.
        test:
          - CMD
          - bash
          - -ec
          - |
            exec 3<>/dev/tcp/127.0.0.1/8080
            printf 'GET /realms/test/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
            if ! head -n 1 <&3 | grep -q '^HTTP/1[.]1 200 '; then
              echo 'Keycloak test realm discovery did not return HTTP 200' >&2
              exit 1
            fi
        interval: 5s
        timeout: 5s
        retries: 10
    depends_on:
      keycloak_db:
        condition: service_healthy
    networks:
      - dlm_network

  keycloak_db:
    image: library/postgres
    container_name: keycloak_db
    ports:
      - 5400:5432
    environment:
        POSTGRES_DB: "keycloak"
        POSTGRES_USER: "admin"
        POSTGRES_PASSWORD: "maximum-finishing-punk"
    networks:
      - dlm_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  dlm_network:
    name: dlm_network

volumes:
  shared-tmpfs:
    name: shared-tmpfs
    driver: local
    driver_opts:
      type: "tmpfs"
      device: "tmpfs"
      o: "mode=1777,uid=1000,gid=1000"
  rclone-ssh-keys:
